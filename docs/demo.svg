<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Python Security Assessment Toolkit terminal output</title>
  <desc id="desc">A stylized terminal showing a synthetic authentication-log finding. This is an illustrative sample, not a captured run.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="690" rx="28" fill="#070b14"/>
  <circle cx="1110" cy="96" r="190" fill="#1d4ed8" opacity="0.08"/>
  <circle cx="94" cy="620" r="210" fill="#06b6d4" opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="56" y="50" width="1088" height="590" rx="18" fill="url(#frame)" stroke="#334155" stroke-width="2"/>
    <rect x="56" y="50" width="1088" height="66" rx="18" fill="#172033"/>
    <rect x="56" y="98" width="1088" height="18" fill="#172033"/>
  </g>

  <circle cx="92" cy="83" r="8" fill="#fb7185"/>
  <circle cx="118" cy="83" r="8" fill="#fbbf24"/>
  <circle cx="144" cy="83" r="8" fill="#34d399"/>
  <text x="600" y="89" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="600">cybersec-toolkit — auth log triage</text>

  <rect x="846" y="70" width="258" height="28" rx="14" fill="#0f2940" stroke="#155e75"/>
  <text x="975" y="89" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.8">ILLUSTRATIVE · SYNTHETIC</text>

  <rect x="56" y="116" width="7" height="524" fill="url(#accent)"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="92" y="163" fill="#22d3ee">$</text>
    <text x="114" y="163" fill="#e2e8f0">python -m cybersec_toolkit logs analyze</text>
    <text x="114" y="193" fill="#94a3b8">samples/sample_auth.log --threshold 5 --window-minutes 5 --output report.txt</text>

    <text x="92" y="246" fill="#f8fafc" font-size="22" font-weight="700">report.txt · illustrative excerpt</text>
    <text x="92" y="278" fill="#94a3b8">Findings:</text>
    <text x="205" y="278" fill="#f8fafc" font-weight="700">1</text>

    <rect x="92" y="307" width="956" height="260" rx="12" fill="#0b1324" stroke="#334155"/>
    <rect x="92" y="307" width="8" height="260" rx="4" fill="#fbbf24"/>
    <rect x="120" y="331" width="96" height="30" rx="15" fill="#422006" stroke="#a16207"/>
    <text x="168" y="352" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700">MEDIUM</text>
    <text x="233" y="352" fill="#f8fafc" font-size="19" font-weight="700">Repeated SSH authentication failures</text>

    <text x="124" y="399" fill="#94a3b8">Source IP</text>
    <text x="340" y="399" fill="#e2e8f0">203.0.113.44</text>
    <text x="124" y="435" fill="#94a3b8">Failure count</text>
    <text x="340" y="435" fill="#e2e8f0">5</text>
    <text x="124" y="471" fill="#94a3b8">Users</text>
    <text x="340" y="471" fill="#e2e8f0">admin, alice, root</text>
    <text x="124" y="507" fill="#94a3b8">MITRE ATT&amp;CK</text>
    <text x="340" y="507" fill="#67e8f9">T1110 · Brute Force</text>
    <text x="124" y="543" fill="#94a3b8">Evidence lines</text>
    <text x="340" y="543" fill="#e2e8f0">4, 5, 6, 7, 8</text>

    <text x="92" y="608" fill="#64748b" font-size="14">Context for analyst review · no automated compromise verdict</text>
    <rect x="534" y="592" width="10" height="20" fill="#22d3ee" opacity="0.9"/>
  </g>
</svg>
